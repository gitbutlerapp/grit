name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every commit on main gets its own complete run: agents land on main every few minutes,
# faster than the test job finishes, so cancelling in-progress main runs meant no commit
# ever got a full result. PR runs still cancel superseded pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runners have no git identity; tests that commit with the system `git` (often with
# GIT_CONFIG_GLOBAL=/dev/null) need one, as every developer machine already has.
env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (workspace tests link many binaries)
        run: ./scripts/ci-free-disk-space.sh

      - name: Install reftable-capable Git (>= 2.45)
        run: ./scripts/ci-install-git.sh

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install rustfilt and pinned nightly (public-fn rustdoc JSON)
        run: |
          cargo install rustfilt --locked
          ./scripts/public-api.sh ensure-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Coverage (reftable interop requires Git >= 2.45)
        env:
          GRIT_REQUIRE_REFTABLE_GIT: "1"
          CARGO_BUILD_JOBS: "1"
        run: make coverage CARGO_BUILD_JOBS=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Coverage floors and upstream mapping checks. The site has its own workflow (site.yml).
      - run: python3 -m unittest discover scripts/tests

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace -- -D warnings

  check-windows-msvc:
    name: check-windows-msvc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Compiles cfg(windows) paths (e.g. worktree_scan) without a Windows runner.
      - run: cargo check -p grit-lib --target x86_64-pc-windows-msvc

  public-api:
    name: public-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Install pinned nightly and cargo-public-api (see scripts/public-api.sh)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          PUBLIC_API_NIGHTLY_DATE="$(grep 'PUBLIC_API_NIGHTLY_DATE=' scripts/public-api.sh | cut -d'"' -f2)"
          CARGO_PUBLIC_API_VERSION="$(grep 'CARGO_PUBLIC_API_VERSION=' scripts/public-api.sh | cut -d'"' -f2)"
          rustup toolchain install "nightly-${PUBLIC_API_NIGHTLY_DATE}" --profile minimal
          cargo install cargo-public-api --version "${CARGO_PUBLIC_API_VERSION}" --locked

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: make public-api-check

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustdoc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  bench-scenarios-smoke:
    name: bench-scenarios-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install reftable-capable Git (>= 2.45)
        run: ./scripts/ci-install-git.sh

      - name: Install hyperfine (grit-bench scenario suite)
        run: |
          HYPERFINE_VERSION=1.19.0
          curl -fsSL "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_amd64.deb" -o /tmp/hyperfine.deb
          sudo dpkg -i /tmp/hyperfine.deb
          hyperfine --version

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-scenarios-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Scenario suite smoke (TIER=S, timings not gated)
        env:
          GRIT_REQUIRE_REFTABLE_GIT: "1"
        run: make bench-scenarios TIER=S SMOKE=1

  bench-daily-smoke:
    name: bench-daily-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install reftable-capable Git (>= 2.45)
        run: ./scripts/ci-install-git.sh

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-daily-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release grit and grit-bench
        run: cargo build --release -p grit-cli -p grit-utils

      - name: Prepare daily smoke fixtures
        env:
          GRIT_REQUIRE_REFTABLE_GIT: "1"
        run: |
          ./target/release/grit-bench fixtures prepare --only synth-10k-smoke,many-refs-smoke,git-git-wt,git-git

      - name: Daily headline smoke (timings not gated)
        run: |
          mkdir -p target/bench
          ./target/release/grit-bench daily --smoke --offline --output target/bench/daily-smoke.json
          ./target/release/grit-bench daily validate target/bench/daily-smoke.json

  test-threaded:
    name: test-threaded
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (release workspace tests link many binaries)
        run: ./scripts/ci-free-disk-space.sh

      - name: Install reftable-capable Git (>= 2.45)
        run: ./scripts/ci-install-git.sh

      - name: Install hyperfine (grit-bench network smoke)
        run: |
          HYPERFINE_VERSION=1.19.0
          curl -fsSL "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_amd64.deb" -o /tmp/hyperfine.deb
          sudo dpkg -i /tmp/hyperfine.deb
          hyperfine --version

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-threaded
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Release workspace tests with parallel Git config
        env:
          GRIT_REQUIRE_REFTABLE_GIT: "1"
          GIT_CONFIG_COUNT: "4"
          GIT_CONFIG_KEY_0: "index.threads"
          GIT_CONFIG_VALUE_0: "4"
          GIT_CONFIG_KEY_1: "pack.threads"
          GIT_CONFIG_VALUE_1: "4"
          GIT_CONFIG_KEY_2: "checkout.workers"
          GIT_CONFIG_VALUE_2: "4"
          GIT_CONFIG_KEY_3: "checkout.thresholdForParallelism"
          GIT_CONFIG_VALUE_3: "0"
          # Serialize crate links; parallel lld on release test binaries has bus-error'd (signal 7).
          CARGO_BUILD_JOBS: "1"
        run: cargo test --release --workspace -j 1

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: |
          cargo +nightly miri test -p grit-lib --lib parallel::policy::
          cargo +nightly miri test -p grit-lib --lib parallel::tests::

  test:
    name: test
    runs-on: ubuntu-latest
    # Workspace tests take ~25 min on a cold cache, before the bench smokes and
    # HTTP transport tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (workspace tests link many binaries)
        run: ./scripts/ci-free-disk-space.sh

      - name: Install reftable-capable Git (>= 2.45)
        run: ./scripts/ci-install-git.sh

      - name: Install hyperfine (grit-bench network smoke)
        run: |
          HYPERFINE_VERSION=1.19.0
          curl -fsSL "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_amd64.deb" -o /tmp/hyperfine.deb
          sudo dpkg -i /tmp/hyperfine.deb
          hyperfine --version

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Workspace tests (reftable interop requires Git >= 2.45)
        env:
          GRIT_REQUIRE_REFTABLE_GIT: "1"
          # Many grit-lib integration tests link a full grit-lib + http-ureq stack at once;
          # parallel lld links have bus-error'd on ubuntu-latest (signal 7).
          CARGO_BUILD_JOBS: "1"
        run: cargo test --workspace -j 1

      - name: Criterion object micro-benchmarks (smoke)
        run: cargo bench -p grit-lib --bench objects -- --test

      - name: Criterion worktree micro-benchmarks (smoke)
        run: cargo bench -p grit-lib --bench worktree -- --test

      - name: Criterion history benchmarks (smoke)
        env:
          GRIT_HISTORY_BENCH_COMMITS: "2000"
        run: cargo bench -p grit-lib --bench history -- --test

      # The transport tests serve repositories with `grit upload-pack` /
      # `grit receive-pack` behind grit-http-server; they skip when either
      # binary is missing, so build both first.
      - run: cargo build -p grit-cli -p grit-http-server

      - name: Smart-HTTP transport tests
        env:
          GRIT_REQUIRE_REFTABLE_GIT: "1"
        run: |
          cargo test -p grit-lib --features http-ureq \
            --test transport_http --test transport_http_auth \
            --test transport_http_proxy_cookies --test transport_http_redirect_auth \
            --test matrix_fetch --test matrix_push --test matrix_sha256 \
            --test matrix_credentials --test remote_dispatch
