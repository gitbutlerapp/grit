[package]
name = "grit-test-support"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false
description = "Shared integration-test infrastructure for the Grit workspace"
repository.workspace = true

[features]
# Tests that start the system `git` or build heavy fixtures run only with this
# feature (`make test-full`, the nightly CI job); see TESTING.md.
full-tests = []

[lints]
workspace = true

[dependencies]
grit-lib = { path = "../grit-lib" }
flate2.workspace = true
hex.workspace = true
insta = { version = "1.42", features = ["json", "filters"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
time.workspace = true
