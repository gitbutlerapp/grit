# Stage 1 CI: format, unit tests, harness smoke (no workspace clippy gate yet).
#
# Toolchain bump: change every `uses: dtolnay/rust-toolchain@…` pin below to the
# same new version and document it in TESTING.md "Continuous integration".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test -p grit-lib -p grit-cli

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --release -p grit-git

      - name: Harness smoke subset (strict)
        run: |
          ./scripts/run-tests.sh --strict --quiet --no-catalog \
            --list data/ci/smoke-tests.txt \
            --data-dir "$RUNNER_TEMP/smoke"
          git diff --exit-code

      - name: Upload per-file smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-harness-logs
          path: ${{ runner.temp }}/smoke/logs/
          if-no-files-found: ignore
