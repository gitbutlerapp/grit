[package]
name = "grit-utils"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Benchmarking and utility tools for grit"
repository = "https://github.com/gitbutlerapp/grit"
# Internal tooling: depends on grit-lib by path only.
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
name = "grit_utils"
path = "src/lib.rs"

[[bin]]
name = "grit-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
grit-lib = { path = "../grit-lib" }
grit-test-support = { path = "../grit-test-support" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
shell-words.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "resource", "signal"] }

[dev-dependencies]
grit-lib = { path = "../grit-lib" }
