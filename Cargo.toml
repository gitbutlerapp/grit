[workspace]
members = ["grit-lib", "grit-protocol", "grit-http-server", "grit-cli", "grit-utils", "grit-examples", "grit-test-support"]
exclude = ["grit-lib/fuzz"]
default-members = ["grit-lib", "grit-protocol", "grit-cli"]
resolver = "2"

[workspace.package]
version = "0.5.25"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/gitbutlerapp/grit"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
terminal_size = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
hex = "0.4"
sha1 = "0.11"
sha2 = "0.11"
sha1dc = "=0.1.5"
tempfile = "3"
similar = "3"
merge3 = "0.2"
regex = "1"
# Same engine and feature set `regex` already enables; listed so filters can set meta options.
regex-automata = { version = "0.4.16", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "dfa-onepass", "perf-inline", "perf-literal", "unicode"] }
libc = "0.2"
ureq = { version = "3.3", default-features = false }
url = "2.5"
base64 = "0.22"
crc32fast = "1.5.0"
memmap2 = "0.9"
memchr = "2.7"
icu_normalizer = "2.0.0"
shell-words = "1.1"
smallvec = "1.15"
toml = "0.8"
filetime = "0.2"
criterion = { version = "0.8.2", features = ["html_reports"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
nix = { version = "0.31", default-features = false, features = ["user", "feature"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

# Hash crates are on every object-id path; compile them at native speed in dev/test.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1dc]
opt-level = 3

# Password hashing in `grit serve` tests is deliberately slow; unoptimized it takes seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Release vs dist (factory step 2370).
# `release`: workspace `--release` builds (including `cargo test --release`) without fat LTO.
# `dist`: shipped `grit`, Release workflow, and grit-bench timings (fat LTO, size-tuned).

[profile.release]
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"
