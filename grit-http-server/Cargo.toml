[package]
name = "grit-http-server"
version.workspace = true
edition.workspace = true
autotests = false
license = "MIT"
description = "Git smart HTTP server powered by grit"
repository = "https://github.com/gitbutlerapp/grit"
publish = false

[lints]
workspace = true

[[bin]]
name = "grit-http-server"
path = "src/main.rs"

[dependencies]
grit-protocol = { version = "0.5", path = "../grit-protocol" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
base64.workspace = true
flate2.workspace = true
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
flate2.workspace = true

# Integration tests build as one binary, tests/integration.rs (see
# scripts/sync_integration_tests.py). The [[test]] targets below run in their own
# process: they change the working directory or environment, or run their own
# binary again by test name.
[[test]]
name = "integration"
path = "tests/integration.rs"
