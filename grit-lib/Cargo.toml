[package]
name = "grit-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autotests = false
license = "MIT"
description = "Core library for the grit Git implementation"
readme = "README.md"
repository = "https://github.com/gitbutlerapp/grit"
autobenches = false

# Match workspace clippy/rustdoc denies; allow `unsafe` for `git_date` (`libc` FFI like Git `date.c`).
# `lints.workspace = true` is incompatible with relaxing `unsafe_code` on this crate alone.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

[features]
# Tests that start the system `git` or build heavy fixtures run only with this
# feature (`make test-full`, the nightly CI job); see TESTING.md.
full-tests = []
# Provides the default `ureq`-backed `HttpClient` for the smart-HTTP transport
# (`transport::http::ureq_client`). Off by default so embedders can bring their
# own HTTP stack.
http-ureq = ["dep:ureq", "dep:base64", "ureq?/rustls"]
# Use the platform TLS stack (Secure Transport on macOS) instead of rustls.
http-ureq-native-tls = ["http-ureq", "ureq?/native-tls"]
# Internal helpers for Criterion benches (EWAH); omitted from the public API snapshot.
unstable-bench-helpers = []
# Forward `trace_span!` to the `tracing` crate (zero cost when disabled).
tracing = ["dep:tracing"]
# Derive `serde::Serialize` on result models (`StatusModel`, `DiffEntry`, `LoadedCommit`,
# commit/switch/reset/fetch/push/stash/rebase outcomes, `Signature`, `Error`, …).
serde-models = []

[dependencies]
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
sha1 = "0.11"
sha1dc.workspace = true
sha2 = "0.11"
flate2.workspace = true
time.workspace = true
hex.workspace = true
tempfile.workspace = true
similar = { workspace = true, features = ["inline"] }
merge3.workspace = true
regex.workspace = true
regex-automata.workspace = true
libc.workspace = true
encoding_rs = "0.8.35"
icu_normalizer.workspace = true
url.workspace = true
filetime.workspace = true
shell-words.workspace = true
smallvec.workspace = true

# Optional: the default `ureq`-backed HTTP client (feature `http-ureq`).
ureq = { workspace = true, optional = true, default-features = false, features = ["gzip"] }
base64 = { workspace = true, optional = true }
crc32fast.workspace = true
getrandom = "0.2"
hashbrown.workspace = true
memmap2.workspace = true
memchr.workspace = true
tzdb = "0.7.3"
tz = { package = "tz-rs", version = "0.7.3" }

# `nix` (uid lookup, uname) is only used behind `#[cfg(unix)]`, so it is not
# pulled in on Windows.
[target.'cfg(unix)'.dependencies]
nix.workspace = true
rustix = { version = "1.1", default-features = false, features = ["process"] }

# `windows-sys` backs the Windows Credential Manager store (`credentials::windows_store`),
# used by the built-in `gs manager` credential helper, and enabling ANSI virtual
# terminal processing for colored output (`terminal`). Windows-only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

