[package]
name = "grit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autotests = false
license = "MIT"
description = "A simplified alternative CLI for Grit"
repository = "https://github.com/gitbutlerapp/grit"
readme = "README.md"

[features]
# Tests that start the system `git` or build heavy fixtures run only with this
# feature (`make test-full`, the nightly CI job); see TESTING.md.
full-tests = []

[[bin]]
name = "grit"
path = "src/main.rs"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
grit-lib = { version = "0.5", path = "../grit-lib", features = ["http-ureq", "tracing", "hot-text-layout"] }
grit-http-server = { version = "0.5", path = "../grit-http-server" }
grit-protocol = { version = "0.5", path = "../grit-protocol" }
tracing-core = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
time.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jaq-core = "3.1"
jaq-json = "2.0"
jaq-std = "3.0"
terminal_size.workspace = true
libc.workspace = true
rpassword = "7"

[target.'cfg(target_os = "macos")'.dependencies]
grit-lib = { version = "0.5", path = "../grit-lib", features = ["http-ureq", "http-ureq-native-tls", "tracing", "hot-text-layout"] }

# Process-creation flags and std-handle inheritance for detaching background `grit gc --auto`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
grit-lib = { path = "../grit-lib", features = ["http-ureq"] }
grit-test-support = { path = "../grit-test-support" }
insta = { version = "1.42", features = ["json", "filters"] }
serde_json.workspace = true
shell-words.workspace = true
tempfile = "3"
jsonschema = "0.29"

# Integration tests build as one binary, tests/integration.rs (see
# scripts/sync_integration_tests.py). The [[test]] targets below run in their own
# process: they change the working directory or environment, or run their own
# binary again by test name.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "remote_refs"
path = "tests/remote_refs.rs"
required-features = ["full-tests"]
