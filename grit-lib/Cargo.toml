[package]
name = "grit-lib"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Core library for the grit Git implementation"
readme = "README.md"
repository = "https://github.com/gitbutlerapp/grit"
autobenches = false

# Match workspace clippy/rustdoc denies; allow `unsafe` for `git_date` (`libc` FFI like Git `date.c`).
# `lints.workspace = true` is incompatible with relaxing `unsafe_code` on this crate alone.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

[features]
# Provides the default `ureq`-backed `HttpClient` for the smart-HTTP transport
# (`transport::http::ureq_client`). Off by default so embedders can bring their
# own HTTP stack.
http-ureq = ["dep:ureq", "dep:base64"]

[dependencies]
thiserror.workspace = true
sha1 = "0.11"
sha2 = "0.11"
flate2.workspace = true
time.workspace = true
hex.workspace = true
tempfile.workspace = true
similar.workspace = true
merge3.workspace = true
imara-diff.workspace = true
regex.workspace = true
libc.workspace = true
unicode-width.workspace = true
encoding_rs = "0.8.35"
icu_normalizer.workspace = true
url.workspace = true
filetime.workspace = true
shell-words.workspace = true

# Optional: the default `ureq`-backed HTTP client (feature `http-ureq`).
ureq = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
crc32fast.workspace = true

# `nix` (uid lookup, uname) is only used behind `#[cfg(unix)]`, so it is not
# pulled in on Windows.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# `windows-sys` backs the Windows Credential Manager store (`credentials::windows_store`),
# used by the built-in `gs manager` credential helper, and enabling ANSI virtual
# terminal processing for colored output (`terminal`). Windows-only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Console"] }

[[bench]]
name = "objects"
harness = false

[[bench]]
name = "worktree"
harness = false

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "history"
harness = false

[[bench]]
name = "hot_paths"
harness = false

[dev-dependencies]
criterion.workspace = true
grit-test-support = { path = "../grit-test-support" }

