name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every commit on main gets its own complete run: agents land on main every few minutes,
# faster than the test job finishes, so cancelling in-progress main runs meant no commit
# ever got a full result. PR runs still cancel superseded pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: make docs-check

      - run: python3 -m unittest discover scripts/tests

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace -- -D warnings

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustdoc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use all CPU cores for Cargo (override .cargo/config.toml jobs = 2)
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test -p grit-lib -p grit-cli

      - name: Criterion object micro-benchmarks (smoke)
        run: cargo bench -p grit-lib --bench objects -- --test

      - name: Criterion worktree micro-benchmarks (smoke)
        run: cargo bench -p grit-lib --bench worktree -- --test

      - name: Criterion history benchmarks (smoke)
        env:
          GRIT_HISTORY_BENCH_COMMITS: "2000"
        run: cargo bench -p grit-lib --bench history -- --test

      # The transport tests serve repositories with `grit upload-pack` /
      # `grit receive-pack` behind grit-http-server; they skip when either
      # binary is missing, so build both first.
      - run: cargo build -p grit-cli -p grit-http-server

      - name: Smart-HTTP transport tests
        run: |
          cargo test -p grit-lib --features http-ureq \
            --test transport_http --test transport_http_auth \
            --test transport_http_proxy_cookies --test transport_http_redirect_auth \
            --test matrix_fetch --test matrix_push --test matrix_sha256 \
            --test matrix_credentials
