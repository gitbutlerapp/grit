[package]
name = "grit-test-support"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false
description = "Shared integration-test infrastructure for the Grit workspace"
repository.workspace = true

[features]
# Tests that start the system `git` or build heavy fixtures run only with this
# feature (`make test-full`, the nightly CI job); see TESTING.md.
full-tests = []

[lints]
workspace = true

[dependencies]
# `serde-models` here turns the feature on for every workspace test and clippy
# build, so `grit-lib/tests/serde_models.rs` runs in the default gate. Likewise
# `unstable-hosting`, so `cargo test -p grit-lib` runs the snapshot-checkout and
# grit-server unit tests.
grit-lib = { path = "../grit-lib", features = ["serde-models", "test-support", "unstable-hosting"] }
flate2.workspace = true
hex.workspace = true
insta = { version = "1.42", features = ["json", "filters"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
time.workspace = true
