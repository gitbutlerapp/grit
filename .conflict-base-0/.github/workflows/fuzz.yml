name: Fuzz

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz (weekly)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    env:
      CXX: g++
      CC: gcc
      RUSTFLAGS: -C linker=g++
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        working-directory: grit-lib/fuzz
        run: cargo +nightly fuzz build

      - name: Fuzz each target (10 minutes)
        id: fuzz_run
        working-directory: grit-lib/fuzz
        run: |
          set +e
          failed=0
          for target in $(cargo +nightly fuzz list); do
            echo "=== fuzz run $target (600s max) ==="
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=600 \
              -artifact_prefix="artifacts/$target/" \
              "corpus/$target"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "target $target exited $status"
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: grit-lib/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report fuzz failures
        if: steps.fuzz_run.outputs.failed != '0'
        run: echo "::warning::One or more fuzz targets reported crashes; see uploaded artifacts."
