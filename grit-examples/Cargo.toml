[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2.workspace = true
# `http-ureq` provides the default ureq-backed HTTP client used by gritx-fetch /
# gritx-push for smart-HTTP remotes.
grit-lib = { path = "../grit-lib", features = ["http-ureq"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile.workspace = true
time.workspace = true

[dev-dependencies]
grit-test-support = { path = "../grit-test-support" }
tempfile.workspace = true
serde_json.workspace = true

# Integration tests build as one binary, tests/integration.rs (see
# scripts/sync_integration_tests.py). The [[test]] targets below run in their own
# process: they change the working directory or environment, or run their own
# binary again by test name.
[[test]]
name = "integration"
path = "tests/integration.rs"
