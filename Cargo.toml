[workspace]
members = ["grit-lib", "grit-protocol", "grit-http-server", "grit-cli", "grit-utils", "grit-examples", "grit-test-support"]
default-members = ["grit-lib", "grit-protocol", "grit-cli"]
resolver = "2"

[workspace.package]
version = "0.5.4"
edition = "2021"
repository = "https://github.com/gitbutlerapp/grit"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
hex = "0.4"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
similar = "3"
imara-diff = { version = "0.2", features = ["unified_diff"] }
merge3 = "0.2"
regex = "1"
unicode-width = "0.2"
libc = "0.2"
hungarian = "1.1.1"
ureq = "3.3"
url = "2.5"
base64 = "0.22"
crc32fast = "1.5.0"
memmap2 = "0.9"
icu_normalizer = "2.0.0"
shell-words = "1.1"
filetime = "0.2"
criterion = { version = "0.8.2", features = ["html_reports"] }
nix = { version = "0.31", default-features = false, features = ["user", "feature"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

# Hash crates are on every object-id path; compile them at native speed in dev/test.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
