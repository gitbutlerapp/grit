[package]
name = "grit-examples"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Standalone example binaries demonstrating grit-lib usage"
repository.workspace = true
publish = false

[[bin]]
name = "gritx-hash-object"
path = "src/bin/gritx-hash-object.rs"

[[bin]]
name = "gritx-hash-file"
path = "src/bin/gritx-hash-file.rs"

[[bin]]
name = "hash-info"
path = "src/bin/hash-info.rs"

[[bin]]
name = "quickstart"
path = "src/bin/quickstart.rs"

[[bin]]
name = "guide_objects"
path = "src/bin/guide_objects.rs"

[[bin]]
name = "guide_repository"
path = "src/bin/guide_repository.rs"

[[bin]]
name = "guide_embedding"
path = "src/bin/guide_embedding.rs"

[[bin]]
name = "guide_revwalk"
path = "src/bin/guide_revwalk.rs"

[[bin]]
name = "guide_network"
path = "src/bin/guide_network.rs"

[[bin]]
name = "guide_refs"
path = "src/bin/guide_refs.rs"

[[bin]]
name = "guide_index"
path = "src/bin/guide_index.rs"

[[bin]]
name = "guide_diff"
path = "src/bin/guide_diff.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2.workspace = true
# `http-ureq` provides the default ureq-backed HTTP client used by gritx-fetch /
# gritx-push for smart-HTTP remotes.
grit-lib = { path = "../grit-lib", features = ["http-ureq"] }
tempfile.workspace = true

[dev-dependencies]
grit-test-support = { path = "../grit-test-support" }
tempfile.workspace = true
serde_json.workspace = true
