[package]
name = "grit-http-server"
version.workspace = true
edition.workspace = true
autotests = false
license = "MIT"
description = "Git smart HTTP server powered by grit"
repository = "https://github.com/gitbutlerapp/grit"

[features]
# Tests that start the system `git` or build heavy fixtures run only with this
# feature (`make test-full`, the nightly CI job); see TESTING.md.
full-tests = []

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "grit-http-server"
path = "src/main.rs"

[dependencies]
grit-lib = { version = "0.5", path = "../grit-lib" }
grit-protocol = { version = "0.5", path = "../grit-protocol" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
base64.workspace = true
flate2.workspace = true
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
getrandom = "0.2"
hex.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
# The ureq client, to sign in against the server the way `grit auth <url>` does.
grit-lib = { version = "0.5", path = "../grit-lib", features = ["http-ureq"] }
tempfile.workspace = true
flate2.workspace = true

# Integration tests build as one binary, tests/integration.rs (see
# scripts/sync_integration_tests.py). The [[test]] targets below run in their own
# process: they change the working directory or environment, or run their own
# binary again by test name.
[[test]]
name = "integration"
path = "tests/integration.rs"
