[package]
name = "grit-examples"
version.workspace = true
edition.workspace = true
autotests = false
license = "MIT"
description = "Standalone example binaries demonstrating grit-lib usage"
repository.workspace = true
publish = false

[features]
# Tests that start the system `git` or build heavy fixtures run only with this
# feature (`make test-full`, the nightly CI job); see TESTING.md.
full-tests = []

