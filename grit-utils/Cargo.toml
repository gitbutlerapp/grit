[package]
name = "grit-utils"
version.workspace = true
edition.workspace = true
autotests = false
license = "MIT"
description = "Benchmarking and utility tools for grit"
repository = "https://github.com/gitbutlerapp/grit"
# Internal tooling: depends on grit-lib by path only.
publish = false
build = "build.rs"

[features]
# Tests that start the system `git` or build heavy fixtures run only with this
# feature (`make test-full`, the nightly CI job); see TESTING.md.
full-tests = []

[lints]
workspace = true

[lib]
name = "grit_utils"
path = "src/lib.rs"

[[bin]]
name = "grit-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
grit-lib = { path = "../grit-lib" }
grit-test-support = { path = "../grit-test-support" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
shell-words.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "resource", "signal"] }

[dev-dependencies]
grit-lib = { path = "../grit-lib" }

# Integration tests build as one binary, tests/integration.rs (see
# scripts/sync_integration_tests.py). The [[test]] targets below run in their own
# process: they change the working directory or environment, or run their own
# binary again by test name.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "daily_e2e"
path = "tests/daily_e2e.rs"
required-features = ["full-tests"]

[[test]]
name = "daily_remotes_e2e"
path = "tests/daily_remotes_e2e.rs"
required-features = ["full-tests"]

[[test]]
name = "daily_repack_correctness"
path = "tests/daily_repack_correctness.rs"
required-features = ["full-tests"]

[[test]]
name = "daily_reset_keep_prepare"
path = "tests/daily_reset_keep_prepare.rs"
required-features = ["full-tests"]

[[test]]
name = "daily_shapes"
path = "tests/daily_shapes.rs"
required-features = ["full-tests"]

[[test]]
name = "daily_stash_prepare"
path = "tests/daily_stash_prepare.rs"
required-features = ["full-tests"]

[[test]]
name = "shallow_clone_verify"
path = "tests/shallow_clone_verify.rs"
required-features = ["full-tests"]

[[test]]
name = "worktree_commit_base"
path = "tests/worktree_commit_base.rs"
required-features = ["full-tests"]

[[test]]
name = "worktree_scenario_e2e"
path = "tests/worktree_scenario_e2e.rs"
required-features = ["full-tests"]
